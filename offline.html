<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a3568">
  <title>Offline — RO World Journey</title>
  <link rel="stylesheet" href="/shared/ro-ui.css">
</head>
<body class="ro-hub">
  <div class="ro-app" style="max-width:480px;margin-top:12vh">
    <div class="ro-window">
      <div class="ro-window-title">
        <span class="ro-window-title-text">Offline</span>
      </div>
      <div class="ro-window-body" style="text-align:center;padding:28px 20px">
        <p style="font-family:var(--font-pixel);font-size:0.7rem;color:var(--ro-gold-bright);margin:0 0 12px;line-height:1.5">NO SIGNAL</p>
        <p style="color:var(--ro-muted);margin:0 0 20px">You are offline. Cached pages and data may still work.</p>
        <p style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
          <a class="ro-btn ro-btn-gold" href="/">Return to Town</a>
          <button type="button" class="ro-btn" onclick="location.reload()">Retry</button>
        </p>
      </div>
    </div>
  </div>
</body>
</html>
